# Go Postery etcd 配置模板
#
# 格式为 key=value；值可以为空，也可以包含空格或等号，请不要额外添加引号。

# ==================== 需要个性化填写的配置 ====================
#
# 注意不要将密钥等敏感信息提交到仓库。
