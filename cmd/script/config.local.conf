go_postery/conf/service_conf/code_service/grpc/port=9001
go_postery/conf/service_conf/code_service/email/subject=Go Postery - 验证您的邮箱
go_postery/conf/service_conf/code_service/email/app_name=Go Postery
go_postery/conf/service_conf/code_service/email/expire_min=10
go_postery/conf/service_conf/code_service/email/year=2026
go_postery/conf/service_conf/code_service/email/address=中国杭州

