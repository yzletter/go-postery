# Code 服务
go_postery/conf/service_conf/code_service/email/from=你的QQ邮箱地址
go_postery/conf/service_conf/code_service/email/auth_code=你的QQ邮箱SMTP服务授权码
go_postery/conf/service_conf/code_service/sms/access_key_id=你的阿里云SMS服务access_key_id
go_postery/conf/service_conf/code_service/sms/access_key_secret=你的阿里云SMS服务access_key_secret

# Interview 服务
go_postery/conf/service_conf/interview_service/ark/api_key=火山方舟key
go_postery/conf/service_conf/interview_service/qwen/llm_api_key=千问key
go_postery/conf/service_conf/interview_service/qwen/embedder_api_key=千问key
go_postery/conf/service_conf/interview_service/github/token=github授权token

# OSS 服务（OSS 回调需要域名，本机部署或没有域名可忽略）
go_postery/conf/service_conf/oss_service/oss/access_key_id=
go_postery/conf/service_conf/oss_service/oss/access_key_secret=
go_postery/conf/service_conf/oss_service/oss/arn=
go_postery/conf/service_conf/oss_service/oss/region=
go_postery/conf/service_conf/oss_service/oss/bucket=
go_postery/conf/service_conf/oss_service/oss/callback_url=

# ==================== 默认配置 ====================

# ==================== 公共配置 ====================
go_postery/conf/common_conf/redis/addr=localhost:6379
go_postery/conf/common_conf/milvus/addr=localhost:19530
go_postery/conf/common_conf/jaeger/addr=localhost:4318
go_postery/conf/common_conf/kafka/addr=localhost:9092
go_postery/conf/common_conf/rabbitmq/addr=localhost:5672
go_postery/conf/common_conf/rabbitmq/user=go_postery
go_postery/conf/common_conf/rabbitmq/password=123456
go_postery/conf/common_conf/rocketmq/addr=localhost:8081
go_postery/conf/common_conf/mysql/addr=localhost:3306
go_postery/conf/common_conf/mysql/user=go_postery_tester
go_postery/conf/common_conf/mysql/password=123456
go_postery/conf/common_conf/mysql/db_name=go_postery
go_postery/conf/common_conf/mysql/log/file_dir=./logs
go_postery/conf/common_conf/mysql/log/filename=mysql.log
go_postery/conf/common_conf/service_hub/heartbeat_frequency=10
go_postery/conf/common_conf/service_hub/register_prefix=go_postery/service/

# ==================== Code 服务 ====================
go_postery/conf/service_conf/code_service/log/filepath=./logs/code_service.log
