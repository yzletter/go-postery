# Jaeger v2：OTLP Trace 接收、查询与 Badger 持久化
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

  telemetry:
    resource:
      attributes:
        - name: service.name
          value: jaeger
    logs:
      level: info

extensions:
  # 容器健康检查接口
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  # Jaeger Query 与 Web UI 使用 trace_store
  jaeger_query:
    storage:
      traces: trace_store

  # 使用 Badger 在本地持久化 Trace
  jaeger_storage:
    backends:
      trace_store:
        badger:
          directories:
            keys: /tmp/jaeger
            values: /tmp/jaeger
          ephemeral: false
          # Trace 保留 7 天
          ttl:
            spans: 168h
          metrics_update_interval: 10s

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: trace_store
