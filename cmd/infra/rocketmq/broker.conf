# RocketMQ 5.5 单节点 Broker 配置

# Broker 基础信息
brokerClusterName = DefaultCluster
brokerName = broker-a
# 0 表示 Master，非 0 表示 Slave
brokerId = 0

# 通过 Docker Service Name 连接 NameServer
namesrvAddr = rocketmq-namesrv:9876

# Broker Remoting 服务监听端口
listenPort = 10911

# 单节点异步 Master、异步刷盘
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 开发环境自动创建 Topic 和 Consumer Group
# 正式环境建议关闭并预先创建
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 消息及索引存储目录，由 Docker Volume 持久化
storePathRootDir = /tmp/store

# 每天凌晨 4 点清理，消息保留 48 小时
deleteWhen = 04
fileReservedTime = 48
