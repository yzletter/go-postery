syntax = "proto3";

package user.v1;

option go_package = "github.com/yzletter/go-postery/api/proto/user/v1;user_grpc";

message UserBrief {
  int64 ID = 1;
  string Nickname = 2;
  string Avatar = 3;
}

message TopUser {
  int64 ID = 1;
  string Nickname = 2;
  string Avatar = 3;
  string Bio = 4;
  float Score = 5;
}

message GetProfileByIdRequest {
  int64 ID = 1;
}

message UserDetail {
  int64 ID = 1;
  string Nickname = 2;
  string Avatar = 3;
  string Bio = 4;
  uint32 Gender = 5;
  string Birthday = 6;
  string Location = 7;
  string Country = 8;
  string LastLoginIP = 9;
}

message UpdateProfileRequest {
  int64 ID = 1;
  string Nickname = 2;
  string Avatar = 3;
  string Bio = 4;
  uint32 Gender = 5;
  string Birthday = 6;
  string Location = 7;
  string Country = 8;
}

message UpdateProfileResponse {}

message TopRequest {}

message TopResponse {
  repeated TopUser TopUsers = 1;
}

message FollowCommonRequest {
  int64 FollowerID = 1; // 关注者 ID
  int64 FolloweeID = 2; // 被关注者 ID
}

message FollowEmptyResponse {}

message IfFollowResponse {
  int32 Result = 1;  // 0 互不关注, 1 a 关注 b, 2 b 关注 a, 3 互相关注
}

message ListFollowRequest {
  int64 UserID = 1;
  uint32 PageNo = 2;
  uint32 PageSize = 3;
}

message ListFollowResponse {
  uint64 Count = 1;
  repeated UserBrief UserBriefs = 2;
}

message UploadAvatarSignRequest {
  int64 UserID = 1;
}

message UploadAvatarSignResponse {
  string Response = 1;
}

message UploadAvatarCallbackRequest {
  int64 UserID = 1;
  string ObjectName = 2;
}

message UploadAvatarCallbackResponse {}

message GetAvatarURLRequest {
  string ObjectName = 1;
}

message GetAvatarURLResponse {
  string URL = 1;
}

message HealthCheckRequest {}
message HealthCheckResponse {}

service UserService {
  // 根据用户 ID 获取用户资料
  rpc GetProfileById(GetProfileByIdRequest) returns (UserDetail);
  // 更新用户资料
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // 返回推荐用户
  rpc Top(TopRequest) returns (TopResponse);
  rpc Follow(FollowCommonRequest) returns (FollowEmptyResponse);
  rpc UnFollow(FollowCommonRequest) returns (FollowEmptyResponse);
  rpc IfFollow(FollowCommonRequest) returns (IfFollowResponse);
  // 按页查找粉丝
  rpc ListFollowersByPage(ListFollowRequest) returns (ListFollowResponse);
  // 按页查找关注的人
  rpc ListFolloweesByPage(ListFollowRequest) returns (ListFollowResponse);
  // 获取上传头像 OSS 的签名
  rpc UploadAvatarSign(UploadAvatarSignRequest) returns (UploadAvatarSignResponse);
  // OSS 信息落库
  rpc UploadAvatarCallback(UploadAvatarCallbackRequest) returns (UploadAvatarCallbackResponse);
  // 获取头像预签名 URL
  rpc GetAvatarURL(GetAvatarURLRequest) returns (GetAvatarURLResponse);
  // 健康检查
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

/*
protoc \
-I . \
api/proto/user/v1/user.proto \
--go_out=. \
--go-grpc_out=. \
--go_opt=paths=source_relative \
--go-grpc_opt=paths=source_relative
 */
