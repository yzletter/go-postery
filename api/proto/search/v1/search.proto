syntax = "proto3";

package search.v1;

option go_package = "github.com/yzletter/go-postery/api/proto/search/v1;search_grpc";

import "search/model/document.proto";
import "search/model/term_query.proto";

message DocID {
  string DocID = 1;
}

message AffectedCount {
  int32 Count = 1;
}

message CountRequest {}

message SearchRequest{
  repeated string Queries = 1;
}

message Query {
  model.TermQuery TermQuery = 1;
  uint64 OnFlag = 2;
  uint64 OffFlag = 3;
  repeated uint64 OrFlags = 4;
}

message SearchResult {
  repeated DocID DocumentIDs = 1;
}

message HealthCheckRequest {}
message HealthCheckResponse {}

service SearchService {
  rpc Search(SearchRequest) returns(SearchResult);
  rpc DeleteDoc(DocID) returns(AffectedCount);
  rpc AddDoc(model.Document) returns(AffectedCount);
  rpc Count(CountRequest) returns(AffectedCount);
  rpc HealthCheck(HealthCheckRequest) returns(HealthCheckResponse);
}

/*
protoc \
-I . \
api/proto/search/v1/search.proto \
--go_out=. \
--go-grpc_out=. \
--go_opt=paths=source_relative \
--go-grpc_opt=paths=source_relative
 */
