syntax = "proto3";

package search.v1;

option go_package = "github.com/yzletter/go-postery/api/proto/search/v1;search_grpc";

message DocID {
  string DocID = 1;
}

message AffectedCount {
  int32 Count = 1;
}

message CountRequest {}

message SearchRequest{
  repeated string Queries = 1;
}

message TermQuery {
  Keyword Keyword = 1;   // Keyword 类型引用自 document.proto
  repeated TermQuery Must = 2;
  repeated TermQuery Should = 3;
}

message Query {
  TermQuery TermQuery = 1;
  uint64 OnFlag = 2;
  uint64 OffFlag = 3;
  repeated uint64 OrFlags = 4;
}

message SearchResult {
  repeated DocID DocumentIDs = 1;
}

// 用于索引的 Keyword
message Keyword {
  string Field = 1;
  string Word = 2;
}

message Document {
  uint64 IndexID = 1;             // 用于索引 ID
  string DocID = 2;               // 业务 ID
  uint64 BitsFeature = 3;         // 表示 Document 特征 Bits
  repeated Keyword Keywords = 4;  // Document 的关键词
  bytes Bytes = 5;                // 业务实体序列化后的结果
}

message HealthCheckRequest {}
message HealthCheckResponse {}

service SearchService {
  rpc Search(SearchRequest) returns(SearchResult);
  rpc DeleteDoc(DocID) returns(AffectedCount);
  rpc AddDoc(Document) returns(AffectedCount);
  rpc Count(CountRequest) returns(AffectedCount);
  rpc HealthCheck(HealthCheckRequest) returns(HealthCheckResponse);
}

/*
protoc \
-I . \
api/proto/search/v1/search.proto \
--go_out=. \
--go-grpc_out=. \
--go_opt=paths=source_relative \
--go-grpc_opt=paths=source_relative
 */
